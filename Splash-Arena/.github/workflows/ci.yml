name: CI — Splash Arena (Godot + Fusion)

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate project (headless Godot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fusion SDK (mirror)
        env:
          FUSION_7Z_URL: ${{ vars.FUSION_7Z_URL }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fusion-dl /tmp/fusion-x
          cd /tmp/fusion-dl
          if [ -n "$FUSION_7Z_URL" ]; then
            curl -fL -o fusion.7z "$FUSION_7Z_URL"
          else
            curl -fL -o fusion.7z "${{ secrets.FUSION_7Z_URL }}"
          fi
          7z x -y fusion.7z -o/tmp/fusion-x
          mkdir -p "$GITHUB_WORKSPACE/addons"
          cp -r /tmp/fusion-x/* "$GITHUB_WORKSPACE/addons/"

      - name: Download Godot 4.6.3
        run: |
          curl -fL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          unzip -o godot.zip -d /tmp
          echo "/tmp" >> "$GITHUB_OUTPUT"  # (упрощено: ниже просто добавляем в PATH)
          mv /tmp/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot

      - name: Validate project (headless import + quit)
        run: |
          /tmp/godot --headless --path . --import 2>&1 | tail -40
          /tmp/godot --headless --path . --quit-after 2 2>&1 | tail -20 || true
