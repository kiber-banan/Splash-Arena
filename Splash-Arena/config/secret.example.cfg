; ============================================================
;  Splash Arena — локальный конфиг с Fusion App ID
; ============================================================
;  Как настроить (один раз):
;
;  1. Скопируй этот файл в  config/secret.cfg
;  2. Открой Photon Dashboard: https://dashboard.photonengine.com
;  3. Выбери своё Fusion-приложение (Version 3) и скопируй App ID
;  4. Вставь его в secret.cfg ниже, между кавычками
;
;  Файл config/secret.cfg добавлен в .gitignore —
;  твой App ID никогда не попадёт в GitHub.
; ============================================================

[fusion]
app_id = ""
